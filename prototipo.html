<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AcolheMind – Protótipo do Diário</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#dfe9ee;--bg:#f4f9fb;--card:#fff;--blue:#1b6a9b;--teal:#36b8b0;--tealbg:#d6f0ee;--ink:#1d3b52;--mut:#5d6b76;--chip:#eef4f7;--lb:#b9d9ea;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0f1a22}}
:root[data-theme="dark"]{--page:#0f1a22}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--page);font-family:Inter,system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.h{font-family:Poppins,Inter,sans-serif;font-weight:600;color:var(--blue)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#phone{width:min(390px,100vw);height:min(844px,100%);background:var(--bg);border-radius:32px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#app{height:100%;position:relative}
.sb{display:flex;justify-content:space-between;padding:14px 24px 0;font-weight:600;font-size:13px;color:#111}
.scr{position:absolute;inset:0;overflow-y:auto;padding:0 20px 24px;display:flex;flex-direction:column}
.home{padding-bottom:84px}
.eb{font-size:10px;color:var(--mut);margin-top:18px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:26px;line-height:1.2}
.av{width:44px;height:44px;border-radius:50%;background:var(--tealbg);display:grid;place-items:center;font-family:Poppins;font-weight:600;color:var(--ink)}
.sub{font-size:13px;color:var(--mut);margin-top:6px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 16px}
.d{padding:8px 0;border-radius:10px;background:var(--card);font-size:10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:6px}
.d b{font-family:Poppins;font-size:15px;color:var(--blue)}
.d.on{background:var(--teal);color:#fff}.d.on b{color:#fff}
h2{font-size:16px;margin-bottom:10px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.cat{background:var(--card);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:12px;font-size:12px;font-weight:600;color:var(--blue);min-height:64px;border:1px solid #e3edf2}
.cat:active,.chip:active,.int:active{transform:scale(.97)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;justify-content:space-between;align-items:baseline}
.row small{font-size:11px;color:var(--mut)}
.rec{display:flex;gap:10px;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);margin-top:14px;flex:none}
.rc{flex:1;background:var(--card);border-radius:12px;padding:12px;border:1px solid #e3edf2}
.rc .t{font-size:12px;font-weight:600;color:var(--blue)}.rc p{font-size:13px;margin:6px 0 8px}
.tag{display:inline-block;background:var(--tealbg);border-radius:8px;padding:4px 10px;font-size:10px}
.empty{font-size:13px;color:var(--mut);background:var(--card);border-radius:12px;padding:14px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.lk{background:transparent;border:1px solid #c9dce6;border-radius:12px;padding:12px;font-size:12px;font-weight:500;color:var(--blue);text-align:left}
nav{position:absolute;left:0;right:0;bottom:0;background:var(--card);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px 14px;border-top:1px solid #e3edf2}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut);padding:4px 0;border-radius:10px}
nav button.on{color:var(--blue);background:var(--tealbg);font-weight:600}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.28)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:96px;background:var(--card);border-radius:24px 24px 0 0;padding:14px 20px 24px;overflow-y:auto;display:flex;flex-direction:column;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:44px;height:4px;border-radius:4px;background:#d7e2e8;margin:0 auto 14px}
.sheet h3{font-size:19px}.cap{font-size:12px;color:var(--teal);margin-top:6px;color:#1a8f95}.hr{font-size:11px;color:var(--mut);margin:4px 0 16px}
.q{font-size:14px;font-weight:600;margin:14px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border-radius:10px;padding:11px 14px;font-size:13px;border:1px solid #e3edf2}
.chip.on,.int.on{background:var(--teal);color:#fff;font-weight:600;border-color:var(--teal)}
.ints{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.int{background:var(--chip);border-radius:10px;padding:13px 0;font-size:13px;border:1px solid #e3edf2}
.lg{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
.hint{font-size:11px;color:var(--mut);text-align:left;margin:-6px 0 10px}
textarea{width:100%;background:var(--chip);border:1px solid #e3edf2;border-radius:10px;padding:14px;font:inherit;font-size:13px;color:var(--ink);resize:none;height:76px}
.err{color:#b3261e;font-size:12px;margin-top:10px;min-height:16px}
.sp{flex:1;min-height:12px}
.pri,.sec{width:100%;border-radius:12px;padding:15px;font-weight:600;font-size:14px;text-align:center}
.pri{background:var(--blue);color:#fff}.pri.teal{background:var(--teal)}
.sec{background:transparent;color:var(--blue);margin-top:10px;font-weight:500;border:1px solid #c9dce6}
.bk{width:36px;height:36px;display:grid;place-items:center;color:var(--blue);margin:14px 0 0 -8px}
.cen{text-align:center}.cen h1{font-size:26px;margin:10px 0}.cen p{font-size:14px;color:var(--mut);line-height:1.5}
.orb{width:210px;height:210px;border-radius:50%;background:var(--tealbg);margin:34px auto;display:grid;place-items:center}
.orb i{width:150px;height:150px;border-radius:50%;background:var(--teal);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-style:normal;font-size:12px}
.orb i svg{width:26px;height:26px}
.breath{animation:br 8s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.breath,.sheet{animation:none}}
.rep{background:var(--card);border-radius:14px;padding:16px;margin-top:14px;border:1px solid #e3edf2}
.big{font-family:Poppins;font-size:40px;color:var(--blue);font-weight:600}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:90px;margin-top:8px;text-align:center;font-size:10px;color:var(--mut)}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bar i{width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--lb);min-height:3px}.bar i.on{background:var(--teal)}
.pro{background:var(--tealbg);border-radius:12px;padding:14px;margin-top:14px;font-size:13px}.pro b{display:block;margin-bottom:6px;color:var(--blue)}
.pg{height:6px;background:#dbe8ee;border-radius:6px;margin:10px 0 18px}.pg i{display:block;height:100%;background:var(--teal);border-radius:6px;transition:width .3s}
.tc{display:flex;gap:10px;background:var(--card);border:1px solid #e3edf2;border-radius:12px;padding:12px;margin-top:10px;font-size:12px;color:var(--mut)}
.tc b{display:block;color:var(--blue);margin-bottom:4px;font-size:13px}
.toast{position:absolute;left:20px;right:20px;bottom:96px;background:#1d3b52;color:#fff;font-size:12px;padding:12px 14px;border-radius:12px;text-align:center;z-index:9}
.cd{background:var(--card);border:1px solid #e3edf2;border-radius:12px;padding:14px;margin-bottom:10px;font-size:13px;line-height:1.5;color:var(--mut)}.cd b{display:block;color:var(--blue);font-size:14px;margin-bottom:4px}.ck{display:flex;gap:10px;align-items:center;text-align:left;width:100%;color:var(--ink)}.ck i{width:22px;height:22px;border-radius:7px;border:2px solid var(--teal);flex:none;display:grid;place-items:center;color:#fff}.ck.on i{background:var(--teal)}.ck.on span{text-decoration:line-through;color:var(--mut)}.ck.on span.nl{text-decoration:none;color:var(--ink)}.calm *{animation:none!important;transition:none!important}
.cover{background:linear-gradient(180deg,#dff3f1 0%,var(--bg) 55%)}
.emb{border:2px solid var(--teal);background:var(--tealbg);color:var(--blue);border-radius:12px;padding:14px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px}
input{width:100%;background:var(--chip);border:1px solid #e3edf2;border-radius:10px;padding:14px;font:inherit;font-size:14px;color:var(--ink);margin-bottom:10px}
input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.lbl{font-size:12px;font-weight:600;margin:6px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}.dots i{width:8px;height:8px;border-radius:50%;background:#cfe0e8}.dots i.on{background:var(--teal);width:22px;border-radius:6px}
.grp{margin-bottom:18px;padding-left:10px;border-left:3px solid var(--blue)}
.grp.care{border-left-color:var(--teal)}
.who{display:inline-block;font-size:11px;font-weight:600;border-radius:8px;padding:4px 10px;margin:2px 0 10px;background:#d5e8f3;color:var(--blue)}
.care .who{background:var(--tealbg);color:#17696a}
.vid{position:absolute;inset:0;background:#0f2130;color:#fff;display:flex;flex-direction:column}
.vtop{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 0;font-size:12px;position:relative;z-index:2}
.enc{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:999px}
.enc svg{width:14px;height:14px}
.vmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1e4a63,#0f2130 70%)}
.vav{width:96px;height:96px;border-radius:50%;background:var(--teal);display:grid;place-items:center;font-family:Poppins,sans-serif;font-size:36px;font-weight:600;color:#fff}
.vme{position:absolute;top:56px;right:14px;width:92px;height:124px;border-radius:14px;background:#1d3b52;border:2px solid rgba(255,255,255,.3);overflow:hidden;display:grid;place-items:center;z-index:2;font-size:10px}
.vme video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.vbar{display:flex;justify-content:center;gap:14px;padding:14px 0 calc(22px + env(safe-area-inset-bottom,0px));position:relative;z-index:2;background:rgba(15,33,48,.9)}
.vb{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;position:relative}
.vb svg{width:22px;height:22px}
.vb.off{background:#fff;color:#0f2130}
.vb.off::after{content:"";position:absolute;width:30px;height:2px;background:#0f2130;transform:rotate(-45deg)}
.vb.end{background:#d93f3f}
.vchat{position:absolute;left:12px;right:12px;bottom:100px;background:#fff;color:var(--ink);border-radius:16px;padding:14px;z-index:3;font-size:12px}
.vnotes{max-height:110px;overflow-y:auto;margin:8px 0}
.vnotes p{background:var(--chip);border-radius:8px;padding:8px;margin-bottom:6px}
.txt{width:100%;padding:12px;font-size:13px;color:var(--mut);text-align:center;margin-top:4px}
.pet{display:block;margin:0 auto;width:190px;height:190px;stroke:none}
.pet.bz{animation:bz .5s ease}
@keyframes bz{30%{transform:translateY(-14px) scale(1.04)}60%{transform:translateY(0)}}
.nstage{position:relative;flex:none;width:270px;height:270px;margin:6px auto;display:flex;align-items:center;justify-content:center}
.nwrap{position:relative;width:190px;height:190px;margin:0}
.nhalo{position:absolute;inset:-4px;border-radius:50%;background:var(--tealbg)}
.bub{background:var(--card);border:1px solid #e3edf2;border-radius:16px;padding:14px;font-size:15px;line-height:1.5;text-align:center;color:var(--ink);margin:6px 0 14px}
@media (prefers-reduced-motion:reduce){.pet.bz{animation:none}}
.lkt{background:var(--tealbg);border-color:transparent;font-weight:600}
nav button.sosb{background:var(--blue);color:#fff;font-weight:600;border-radius:14px}
nav button.sosb.on{box-shadow:0 0 0 2px var(--teal)}
.ol{counter-reset:n;padding:0;list-style:none;margin:6px 0 0}
.ol li{counter-increment:n;display:flex;gap:10px;margin:10px 0;font-size:13px;line-height:1.5;color:var(--ink)}
.ol li::before{content:counter(n);flex:none;width:22px;height:22px;border-radius:50%;background:var(--tealbg);color:#17696a;font-weight:600;font-size:12px;display:grid;place-items:center}
.bl{padding-left:18px;margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--ink)}
.mini{background:var(--chip);border:1px solid #e3edf2;border-radius:10px;padding:8px 10px;font-size:11.5px}
.mini.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
.tg{background:var(--chip)}
.tw{background:#fde7d6;color:#8a4b12}
.tag{margin-top:4px}
.chat{position:absolute;left:0;right:0;top:0;bottom:66px;display:flex;flex-direction:column}
.chead{padding:0 20px 6px}
.catrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.catrow::-webkit-scrollbar{display:none}
.catrow .chip{flex:none;white-space:nowrap}
.cmsgs{flex:1;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:10px}
.mu{display:flex;justify-content:flex-end}
.mb{display:flex;justify-content:flex-start}
.bu{max-width:82%;background:var(--blue);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bb{max-width:94%;background:var(--card);border:1px solid #e3edf2;border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.bb p{margin:0 0 6px}
.bb h4{font-family:Poppins,sans-serif;font-weight:600;font-size:12.5px;color:var(--blue);margin:12px 0 4px}
.bb textarea{height:56px;margin-top:8px;padding:10px;font-size:12.5px}
.bb .sv{font-size:11px;color:#17696a;margin:6px 0 0}
.typ{display:flex;gap:5px;padding:14px}
.typ span{width:7px;height:7px;border-radius:50%;background:var(--lb);animation:tp 1s infinite}
.typ span:nth-child(2){animation-delay:.15s}
.typ span:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{transform:translateY(-4px);background:var(--teal)}}
.cinp{padding:8px 20px 2px;background:var(--bg);border-top:1px solid #e3edf2}
.cinp textarea{height:54px;padding:10px 12px;font-size:14px}
.cinp .pri{margin-top:8px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.cav{font-size:10.5px;color:var(--mut);padding:6px 20px 4px;line-height:1.35;background:var(--bg)}
@media (max-width:500px){#phone{border-radius:0;height:100%}.sb{display:none}}
</style>
</head>

<script>

var CATS=[['Alimentação','fork'],['Sono / Rotina','moon'],['Gatilho / Evento','layers'],['Crise','heart']];

var DL=['S','T','Q','Q','S','S','D'];

function intL(i){return i<=2?'leve':i==3?'média':'alta'}
function go(s){if(S.emerg&&!/^(sos|sosg|ia|pause|pet|cover|login)$/.test(s))s='sos';if(s=='cover'||s=='login')S.emerg=false;if(S.iv){clearInterval(S.iv);S.iv=0}if(S.s=='video'&&s!='video')stopCam();if(s=='video'){S.vt=0;S.mic=true;S.cam=false;S.chat=false;S.iv=setInterval(function(){S.vt++;var e=document.getElementById('vt');if(e)e.textContent=fmt(S.vt)},1000)}if(S.s=='pet'&&s!='pet')S.pb=false;if(s=='pause'&&S.s!='pause')S.pfrom=S.s;S.s=s;S.err='';S.conf=false;R()}

if(!S.chip||!S.int){S.err='Escolha o que pode ter contribuído e a intensidade.';R();return}

S.recs.sort(function(a,b){return a.t<b.t?-1:1});
if(S.cat=='Crise'){S.pfrom='save';S.s='pause'}else S.s='saved';S.err='';R()}
var RT={'Início':'inicio','Diário':'home','SOS':'sos','Apoio':'cuidador','Consultas':'consultas'};
var TAB={home:'Diário',sheet:'Diário',inicio:'Início',sos:'SOS',sosg:'SOS',ia:'SOS',hist:'SOS',consultas:'Consultas',cuidador:'Apoio',micro:'Apoio'};

var SB={};SIT.forEach(function(s){SB[s.id]=s});
function nz(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/auto[\s-]+agress/g,'autoagress').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
function tem(n,p){return p.charAt(p.length-1)=='*'?n.indexOf(' '+p.slice(0,-1))>=0:n.indexOf(' '+p+' ')>=0}
function pontua(n,s){var sc=0;s.kw.forEach(function(k){if(tem(n,k))sc+=k.indexOf(' ')>=0?3:2});s.all.forEach(function(g){if(g.every(function(l){return l.some(function(k){return tem(n,k)})}))sc+=3});return sc}
function analisar(txt){var t=nz(txt),n=' '+t+' ';
if(EMG.test(n))return {tipo:'emg'};
var c=[];SIT.forEach(function(s){var p=pontua(n,s);if(p>0)c.push({s:s,p:p+(S.cat==s.cat?1:0)})});
if(!c.length)return {tipo:'g'};
c.sort(function(a,b){return b.s.pri-a.s.pri||b.p-a.p});
return {tipo:'sit',s:c[0].s,outros:c.slice(1,3).map(function(x){return x.s.nome})}}
function loadHist(){try{var v=JSON.parse(localStorage.getItem('acolhemind_sos_hist')||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}

S.msgs=[];S.cat=-1;S.ft='';S.typing=false;S.fcs=false;S.hist=loadHist();S.conf=false;
function uid(){return Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)}
function hget(id){for(var i=0;i<S.hist.length;i++)if(S.hist[i].id==id)return S.hist[i];return null}
function lis(a){return a.map(function(t){return '<li>'+t+'</li>'}).join('')}
function pickCat(i){var t=document.getElementById('cm');if(t)S.ft=t.value;S.cat=S.cat==i?-1:i;R()}
function focusCm(){var t=document.getElementById('cm');if(t)t.focus()}
function send(){if(S.typing)return;var t=document.getElementById('cm'),v=((t&&t.value)||S.ft||'').trim();
if(!v){S.err='Escreva uma mensagem para eu poder ajudar: conte com suas palavras o que está acontecendo.';S.fcs=true;R();return}
S.err='';S.ft='';S.msgs.push({w:'u',t:v});S.typing=true;S.fcs=true;R();
setTimeout(function(){responder(v);S.typing=false;S.fcs=true;R()},650)}
function responder(v){var r=analisar(v);
if(r.tipo=='emg'){S.msgs.push({w:'b',k:'emg'});return}
if(r.tipo=='g'){S.msgs.push({w:'b',k:'g'});return}
var nm=S.kids[S.ki],ant=null;for(var i=S.hist.length-1;i>=0;i--)if(S.hist[i].kn==nm&&S.hist[i].sid==r.s.id&&S.hist[i].r&&S.hist[i].r!='nt'){ant=S.hist[i];break}
var prev=ant?(ant.r=='bem'||ant.r=='pouco'?'Da última vez que falamos sobre isso, você contou que a orientação ajudou. Cada dia é diferente, então vale observar como a criança reage.':'Da última vez que falamos sobre isso, a orientação não ajudou ou a situação piorou. Experimente os passos com calma e converse com um profissional sobre outras opções.'):'';
var e={id:uid(),kn:nm,t:new Date().toISOString(),sid:r.s.id,sn:r.s.nome,txt:v,r:null,com:''};S.hist.push(e);saveHist();
S.msgs.push({w:'b',k:'sit',sid:r.s.id,eid:e.id,prev:prev,note:r.outros.length?'Também percebi sinais de: '+r.outros.join('; ').toLowerCase()+'. Se quiser, me conte mais sobre isso.':''})}
function rate(id,k){var e=hget(id);if(!e)return;e.r=e.r==k?null:k;saveHist();R()}
function saveCom(id,v){var e=hget(id);if(e){e.com=v.trim().slice(0,500);saveHist()}}
function delEnt(id){S.hist=S.hist.filter(function(h){return h.id!=id});saveHist();R()}
function delAll(){if(!S.conf){S.conf=true;R();return}S.hist=S.hist.filter(function(h){return h.kn!=S.kids[S.ki]});saveHist();S.conf=false;flash('Histórico apagado.')}

function ia(){var cs=CATS_SOS.map(function(c,i){return `<button class="chip${S.cat==i?' on':''}" onclick="pickCat(${i})">${c}</button>`}).join('');
